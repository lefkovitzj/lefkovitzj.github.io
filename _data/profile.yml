biography:
  - >-
    I'm Joseph Lefkovitz, a computer science student at the University of Dayton, expecting to graduate in May 2027. My interests include backend engineering, self-hosting, open-source software, and quantum computing. I also help lead the University of Dayton's ACM chapter.
  - >-
    After interning in JPMorgan Chase's Software Engineering Program during summer 2026, I'll return as a Software Engineering Program Analyst in July 2027. Previously, I worked as a Computer Science Intern at NexSens Technology.
