{% assign person_id = '/#person' | absolute_url %}
{% assign website_id = '/#website' | absolute_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": {{ person_id | jsonify }},
      "name": {{ site.author.name | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "image": {{ site.author.image | absolute_url | jsonify }},
      "description": {{ site.description | jsonify }},
      "sameAs": {{ site.author.same_as | jsonify }}
    },
    {
      "@type": "WebSite",
      "@id": {{ website_id | jsonify }},
      "name": {{ site.title | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "inLanguage": {{ site.lang | jsonify }},
      "publisher": { "@id": {{ person_id | jsonify }} }
    },
    {
      "@type": "{% if page.url == '/' %}ProfilePage{% elsif page.url == '/projects' %}CollectionPage{% else %}WebPage{% endif %}",
      "@id": {{ canonical_url | append: '#webpage' | jsonify }},
      "name": {{ seo_title | jsonify }},
      "description": {{ seo_description | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "inLanguage": {{ site.lang | jsonify }},
      "isPartOf": { "@id": {{ website_id | jsonify }} },
      "author": { "@id": {{ person_id | jsonify }} }
      {% if page.url == '/' %},
      "mainEntity": { "@id": {{ person_id | jsonify }} }
      {% elsif page.layout == 'project' %},
      "mainEntity": { "@id": {{ canonical_url | append: '#source-code' | jsonify }} },
      "breadcrumb": { "@id": {{ canonical_url | append: '#breadcrumb' | jsonify }} }
      {% elsif page.url == '/projects' %},
      "mainEntity": {
        "@type": "ItemList",
        "itemListElement": [
          {% assign seo_projects = site.pages | where: 'layout', 'project' | sort: 'order' %}
          {% for project in seo_projects %}
          {
            "@type": "ListItem",
            "position": {{ forloop.index }},
            "name": {{ project.title | jsonify }},
            "url": {{ project.url | absolute_url | jsonify }}
          }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ]
      }
      {% endif %}
    }
    {% if page.layout == 'project' %},
    {
      "@type": "SoftwareSourceCode",
      "@id": {{ canonical_url | append: '#source-code' | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ seo_description | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "author": { "@id": {{ person_id | jsonify }} },
      "keywords": {{ page.technologies | join: ', ' | jsonify }}
      {% if page.project_source_link %},
      "codeRepository": {{ page.project_source_link | jsonify }}
      {% endif %}
    },
    {
      "@type": "BreadcrumbList",
      "@id": {{ canonical_url | append: '#breadcrumb' | jsonify }},
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ '/' | absolute_url | jsonify }} },
        { "@type": "ListItem", "position": 2, "name": "Projects", "item": {{ '/projects' | absolute_url | jsonify }} },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": {{ canonical_url | jsonify }} }
      ]
    }
    {% endif %}
  ]
}
</script>
